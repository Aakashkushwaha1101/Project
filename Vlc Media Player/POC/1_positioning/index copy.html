<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <!-- browser kucch reset krta h to us chiz ko isme -->
    <link rel="stylesheet" href="reset.css">
    <!-- new styling specific to this application -->
    <link rel="stylesheet" href="style.css">
     
</head>

<body>
    <!-- <h2>Vlc Media Player</h2> -->
    <header>
        <div class="title-bar">
            <img src="./image.png" alt="vlc-png" class="title-img">
            <h1 class="title-text">VLC media player</h1>
        </div>
        <div class="menu-bar" >
            <div class="menu-btn"  id="media-btn">Media</div>
            <!-- get file from pc to play  -->
            <input type="file" class="media" id="media-input">
            
            <div class="menu">
                <div class="menu-btn">playback</div>
                <ul class="menu-items">
                    <li id="speedUp">SpeedUp</li>
                    <li id="speedDown">SpeedDown</li>
                </ul>
            </div>

            <!-- class use karo styling add karne ke liye aur id use karo script ke liye -->
            <div class="menu">
                <div class="menu-btn">Audio</div>
                <ul class="menu-items">
                    <li id="increase">Increase</li>
                    <li id="decrease">Decrease</li>
                    <li id="mute">Mute</li>
                </ul> 
            </div>
        </div>
        <div class="toast"></div>
    </header>
    <!-- ............. -->
    <main class="main-display" id="main">
        
    </main>


    <!-- ............... -->
    <footer >
        <div class="seekBar">
            <span class="start-duration" id="start-video">0.00</span>
            <input type="range" id="seekbar" value="0" min="10" step="0.1">
            <span class="end-duration" id="duration">0.00</span>
        </div>
        <div class="footer-menu">

            <i class="fa-solid fa-play" id="play" style="color: #565758;"></i>
            <i class="fa-solid fa-backward-fast" id="back" style="color: #565758;"></i>
            <i class="fa-solid fa-pause" id="pause" style="color: #565758;"></i>
            <i class="fa-solid fa-forward-fast" id="forward" style="color: #565758;"></i>
            <i class="fa-solid fa-expand" id="fullscreen" style="color: #565758;"></i>  

        </div>
        

    </footer>
   
</body>
<script src="script.js"></script>
</html>
